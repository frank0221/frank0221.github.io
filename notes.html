<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Frank Wu 的技术笔记和随笔。">
    <title>Notes | Frank Wu</title>
    <link rel="stylesheet" href="css/style.css?v=20260621-4">
</head>
<body>
    <div id="app">
        <header class="site-header">
            <nav class="nav-bar" aria-label="主导航">
                <a class="brand" href="index.html#top" aria-label="返回首页">Frank Wu</a>
                <div class="nav-links">
                    <a href="index.html#about">About</a>
                    <a href="index.html#focus">Focus</a>
                    <a class="nav-link-active" href="notes.html">Notes</a>
                    <a href="index.html#timeline">Timeline</a>
                </div>
                <a class="nav-cta" href="https://github.com/frank0221" target="_blank" rel="noreferrer">GitHub</a>
            </nav>
        </header>

        <main>
            <section class="section section-white notes-page" id="notes">
                <div class="section-inner">
                    <div class="section-heading notes-heading">
                        <div>
                            <p class="eyebrow">Notes</p>
                            <h1>随笔与技术笔记。</h1>
                        </div>
                    </div>

                    <div class="notes-shell">
                        <aside class="notes-panel" aria-label="文章列表">
                            <label class="search-box">
                                <span>Search</span>
                                <input id="searchInput" type="search" placeholder="搜索标题、分类或日期">
                            </label>
                            <div class="filter-row" id="categoryFilters" aria-label="分类筛选"></div>
                            <div class="post-list" id="postList"></div>
                        </aside>

                        <article class="reader" aria-live="polite">
                            <div class="reader-meta" id="readerMeta"></div>
                            <div class="markdown-body" id="articleContent">
                                <p class="empty-state">选择一篇文章开始阅读。</p>
                            </div>
                        </article>
                    </div>
                </div>
            </section>
        </main>

        <footer class="site-footer">
            <span>© 2026 Frank Wu</span>
            <span>Built for GitHub Pages.</span>
        </footer>
    </div>

    <script src="js/app.js?v=20260621-3"></script>
</body>
</html>
